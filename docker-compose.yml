version: '3.9'

services:
  # MongoDB Service
  mongo:
    image: mongo:6.0
    container_name: donation-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db   # Persist data
    ports:
      - "27018:27017"         # Host port 27018, container port 27017
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.stats()"]
      interval: 10s
      retries: 20
      start_period: 15s

  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: donation-backend
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      retries: 20
      start_period: 15s

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: donation-frontend
    ports:
      - "3000:80"             # Map container port 80 to host port 3000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 15s
      retries: 20
      start_period: 15s

# Persistent volume for MongoDB
volumes:
  mongo-data:

# Network for all services
networks:
  app-network:
    driver: bridge
