# ===========================================
# GITHUB ACTIONS: BUILD & PUSH DOCKER IMAGES
# ===========================================
# This workflow automatically builds Docker images
# and pushes them to Docker Hub when you push code

name: Build and Push Docker Images

# When to run this workflow
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  # =========================================
  # JOB 1: BUILD AND PUSH BACKEND
  # =========================================
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Get the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx (for better builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4: Build and push backend image
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/donation-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/donation-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================
  # JOB 2: BUILD AND PUSH FRONTEND
  # =========================================
  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Get the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4: Build and push frontend image
      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/donation-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/donation-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================
  # JOB 3: DEPLOY TO EC2 (OPTIONAL)
  # =========================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]  # Wait for both builds
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      # Step 1: Deploy via SSH
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            cd ~/donation-campaign
            
            # Pull latest images
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/donation-backend:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/donation-frontend:latest
            
            # Restart containers with new images
            docker-compose down
            docker-compose up -d
            
            # Clean up old images
            docker image prune -f
            
            echo "✅ Deployment complete!"
