# ===========================================
# GITHUB ACTIONS: BUILD & PUSH DOCKER IMAGES
# ===========================================

name: Build and Deploy Donation Campaign

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ===========================================
  # JOB 1: Build and Push Docker Images
  # ===========================================
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: irashasenarathna/donation-backend:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: irashasenarathna/donation-frontend:latest

  # ===========================================
  # JOB 2: Deploy to EC2
  # ===========================================
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            mkdir -p /home/ubuntu/donation-campaign
            cd /home/ubuntu/donation-campaign
            
            docker-compose down || true
            docker container prune -f || true
            
            docker pull irashasenarathna/donation-backend:latest
            docker pull irashasenarathna/donation-frontend:latest
            
            cat > docker-compose.yml << 'EOF'
            version: '3.9'
            
            services:
              mongo:
                image: mongo:6.0
                container_name: donation-mongo
                restart: unless-stopped
                volumes:
                  - mongo-data:/data/db
                networks:
                  - app-network
            
              backend:
                image: irashasenarathna/donation-backend:latest
                container_name: donation-backend
                restart: unless-stopped
                environment:
                  - NODE_ENV=production
                  - PORT=5000
                  - MONGODB_URI=mongodb://mongo:27017/donation_db
                  - JWT_SECRET=your-super-secret-jwt-key-change-this
                ports:
                  - "5000:5000"
                depends_on:
                  - mongo
                networks:
                  - app-network
            
              frontend:
                image: irashasenarathna/donation-frontend:latest
                container_name: donation-frontend
                restart: unless-stopped
                ports:
                  - "3000:80"
                depends_on:
                  - backend
                networks:
                  - app-network
            
            volumes:
              mongo-data:
            
            networks:
              app-network:
                driver: bridge
            EOF
            
            docker-compose up -d
            
            sleep 15
            docker ps
            
            echo "✅ Deployment complete!"
            echo "Frontend: http://$(curl -s ifconfig.me):3000"
            echo "Backend: http://$(curl -s ifconfig.me):5000"
